name = "wadi-el-heyool"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "school-db"
database_id = "cc412eba-4001-4ad0-9378-721357eae398"

[observability]
enabled = true

# Cloudflare Workers AI (free daily allowance) — powers the AI features (cards, games, document generator)
[ai]
binding = "AI"
